name: Bug report
description: Report a reproducible problem in Ursly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Ursly. Please remove secrets, API keys, tokens, and private source content from your report.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behaviour you observed and what you expected instead.
      placeholder: I uploaded a PDF, but...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open...
        2. Upload...
        3. Select...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include web or mobile, browser/device, OS, and whether this is local or deployed.
      placeholder: Web, Safari 18, macOS 15, deployed demo
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add a redacted error message, screenshot, or relevant logs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have removed secrets and private source content.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
