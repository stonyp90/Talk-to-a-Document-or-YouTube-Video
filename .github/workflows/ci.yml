name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned secret scanner
        run: |
          docker pull ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          container=$(docker create ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f)
          docker cp "$container:/usr/bin/gitleaks" /tmp/gitleaks
          docker rm "$container"
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: npm run security:secrets
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Build with fake secret canaries and inspect emitted client assets
        env:
          OPENAI_API_KEY: ci_canary_OPENAI_clearlyfakefixture_2026
          AWS_SECRET_ACCESS_KEY: ci_canary_AWS_clearlyfakefixture_2026
        run: |
          npm run build
          node infrastructure/scripts/check-client-secrets.mjs
      - name: Start deterministic local application services
        run: docker compose up -d --build --wait --wait-timeout 180 web
      - name: Executable local BDD (pending or undefined steps fail)
        run: npm run test:gherkin -- --tags 'not @external'
      - name: Declare outstanding external release requirements
        run: echo '::notice::Scenarios tagged @external are not verified by local CI. Live provider, simulator, and deployed AWS evidence remains required for full release acceptance.'
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=critical
      - run: node --test infrastructure/tests/*.test.cjs
      - if: always()
        run: docker compose down -v
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.7
      - run: terraform fmt -check -recursive infrastructure/terraform
      - name: Validate and test Terraform without cloud credentials
        run: |
          for target in bootstrap modules/demo modules/email environments/demo environments/domain environments/email; do
            terraform -chdir="infrastructure/terraform/$target" init -backend=false -lockfile=readonly
            terraform -chdir="infrastructure/terraform/$target" validate
          done
          terraform -chdir=infrastructure/terraform/bootstrap test
          terraform -chdir=infrastructure/terraform/modules/demo test
          terraform -chdir=infrastructure/terraform/modules/email test
          terraform -chdir=infrastructure/terraform/environments/email test
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build web
      - run: docker compose build transcript
      - run: docker build --platform linux/amd64 --provenance=false --sbom=false -f infrastructure/transcript.Dockerfile -t talk-transcript-lambda:ci .
      - run: docker compose up -d --wait --wait-timeout 180 web
      - run: node infrastructure/scripts/smoke.mjs http://localhost:3000
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile
      - run: npm run typecheck --prefix apps/mobile
      - run: npm test --prefix apps/mobile
      - name: Bundle both native targets (does not certify simulator runtime)
        working-directory: apps/mobile
        run: |
          npx expo export --platform ios --output-dir dist/ios
          npx expo export --platform android --output-dir dist/android
      - name: Report mobile audit findings with explicit critical failure threshold
        run: node infrastructure/scripts/mobile-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-dependency-audit
          path: infrastructure/mobile-audit.json
          if-no-files-found: error
  required:
    if: always()
    needs: [application, containers, mobile, infrastructure, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        env:
          SECRETS: ${{ needs.secrets.result }}
          APPLICATION: ${{ needs.application.result }}
          CONTAINERS: ${{ needs.containers.result }}
          MOBILE: ${{ needs.mobile.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
        run: test "$SECRETS" = success && test "$APPLICATION" = success && test "$CONTAINERS" = success && test "$MOBILE" = success && test "$INFRASTRUCTURE" = success
