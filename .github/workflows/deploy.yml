name: Deploy AWS
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
      TF_VAR_openai_secret_arn: ${{ vars.OPENAI_SECRET_ARN }}
      TF_VAR_auth_pepper_secret_arn: ${{ vars.AUTH_PEPPER_SECRET_ARN }}
      # The origin the public reaches this deployment on, which CORS allows and
      # the published OpenAPI document names as its server. Unset, the
      # deployment names the gateway's own endpoint; a localhost default here
      # would have deployed an address no caller of this API can reach.
      TF_VAR_app_origin: ${{ vars.APP_ORIGIN }}
      TF_VAR_ses_identity_arn: ${{ vars.SES_IDENTITY_ARN }}
      TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME }}
      TF_VAR_ses_from_address: ${{ vars.SES_FROM_ADDRESS }}
      OPENAI_SECRET_ARN: ${{ vars.OPENAI_SECRET_ARN }}
      AUTH_PEPPER_SECRET_ARN: ${{ vars.AUTH_PEPPER_SECRET_ARN }}
      SES_IDENTITY_ARN: ${{ vars.SES_IDENTITY_ARN }}
      SES_CONFIGURATION_SET_NAME: ${{ vars.SES_CONFIGURATION_SET_NAME }}
      SES_FROM_ADDRESS: ${{ vars.SES_FROM_ADDRESS }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      # Where the browser opens the live discussion. The content policy that lets
      # it reach that host is written into the web image, so this is a build
      # argument and not a function environment variable: changing it means a
      # rebuild. It must name the same host the domain root maps the socket onto.
      CHAT_SOCKET_URL: ${{ vars.CHAT_SOCKET_URL || 'wss://ws.ursly.io' }}
      ECR_REPOSITORY: talk-to-a-document-api
      # What the deployed site tells crawlers and answer engines about itself.
      # The YouTube ids stay empty until the introduction is published there.
      SITE_URL: ${{ vars.SITE_URL || 'https://ursly.io' }}
      SITE_SAME_AS: ${{ vars.SITE_SAME_AS }}
      INTRO_VIDEO_YOUTUBE_ID_EN: ${{ vars.INTRO_VIDEO_YOUTUBE_ID_EN }}
      INTRO_VIDEO_YOUTUBE_ID_FR: ${{ vars.INTRO_VIDEO_YOUTUBE_ID_FR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require configuration and tested revision
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -n "$AWS_REGION" && test -n "$AWS_ROLE_ARN" && test -n "$TF_STATE_BUCKET" && test -n "$TF_VAR_account_id"
          test -n "$OPENAI_SECRET_ARN"
          # The sign-in gate fails shut, so a deployment missing any of these
          # comes up refusing every paid endpoint with no way for a reader to
          # get in. Fail here, where it is a red workflow, not there, where it
          # is an outage. The identity and its configuration set come from the
          # operator-owned environments/email root, and modules/demo refuses to
          # plan with EMAIL_MODE=ses unless all three are set, so check all
          # three here. Only the names are checked; no value is ever printed.
          test -n "$AUTH_PEPPER_SECRET_ARN"
          test -n "$SES_IDENTITY_ARN"
          test -n "$SES_CONFIGURATION_SET_NAME"
          test -n "$SES_FROM_ADDRESS"
          # The browser is told where the live discussion is when the image is
          # built, so an empty value here ships a bundle that can never open it.
          test -n "$CHAT_SOCKET_URL"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Publish exact tested commit
        run: |
          DEPLOY_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$DEPLOY_ACCOUNT" = "$TF_VAR_account_id"
          REGISTRY="$DEPLOY_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TESTED_SHA" >/dev/null 2>&1; then
