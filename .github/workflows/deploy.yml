      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Initialize application state only
        run: |
          terraform -chdir=infrastructure/terraform/environments/demo init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Plan tested infrastructure
        run: |
          terraform -chdir=infrastructure/terraform/environments/demo plan -input=false -lock-timeout=5m -out=deployment.tfplan
      - name: Apply the saved plan with the scoped OIDC role
        run: terraform -chdir=infrastructure/terraform/environments/demo apply -input=false -lock-timeout=5m deployment.tfplan
      - name: Mandatory deployment smoke tests
        run: |
          PUBLIC_URL="$(terraform -chdir=infrastructure/terraform/environments/demo output -raw public_url)"
          test -n "$PUBLIC_URL" && test "$PUBLIC_URL" != None
          SOCKET_URL="$(terraform -chdir=infrastructure/terraform/environments/demo output -raw socket_url)"
          case "$SOCKET_URL" in wss://*) ;; *) echo "No live discussion endpoint was deployed" >&2; exit 1 ;; esac
          node infrastructure/scripts/smoke.mjs "$PUBLIC_URL"
