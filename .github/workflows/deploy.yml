name: Deploy AWS
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
      TF_VAR_openai_secret_arn: ${{ vars.OPENAI_SECRET_ARN }}
      TF_VAR_app_origin: ${{ vars.APP_ORIGIN || 'http://localhost:3000' }}
      OPENAI_SECRET_ARN: ${{ vars.OPENAI_SECRET_ARN }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      ECR_REPOSITORY: talk-to-a-document-api
      # What the deployed site tells crawlers and answer engines about itself.
      # The YouTube ids stay empty until the introduction is published there.
      SITE_URL: ${{ vars.SITE_URL || 'https://ursly.io' }}
      SITE_SAME_AS: ${{ vars.SITE_SAME_AS }}
      INTRO_VIDEO_YOUTUBE_ID_EN: ${{ vars.INTRO_VIDEO_YOUTUBE_ID_EN }}
      INTRO_VIDEO_YOUTUBE_ID_FR: ${{ vars.INTRO_VIDEO_YOUTUBE_ID_FR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require configuration and tested revision
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -n "$AWS_REGION" && test -n "$AWS_ROLE_ARN" && test -n "$TF_STATE_BUCKET" && test -n "$TF_VAR_account_id"
          test -n "$OPENAI_SECRET_ARN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Publish exact tested commit
        run: |
          DEPLOY_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$DEPLOY_ACCOUNT" = "$TF_VAR_account_id"
          REGISTRY="$DEPLOY_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TESTED_SHA" >/dev/null 2>&1; then
            docker build --platform linux/amd64 --provenance=false --sbom=false --target runtime --build-arg SITE_URL="$SITE_URL" --build-arg SITE_SAME_AS="$SITE_SAME_AS" --build-arg INTRO_VIDEO_YOUTUBE_ID_EN="$INTRO_VIDEO_YOUTUBE_ID_EN" --build-arg INTRO_VIDEO_YOUTUBE_ID_FR="$INTRO_VIDEO_YOUTUBE_ID_FR" --label org.opencontainers.image.revision="$TESTED_SHA" -t "$REGISTRY/$ECR_REPOSITORY:$TESTED_SHA" .
            docker push "$REGISTRY/$ECR_REPOSITORY:$TESTED_SHA"
          fi
          if ! aws ecr describe-images --repository-name talk-to-a-document-transcript --image-ids imageTag="$TESTED_SHA" >/dev/null 2>&1; then
            docker build --platform linux/amd64 --provenance=false --sbom=false -f infrastructure/transcript.Dockerfile --label org.opencontainers.image.revision="$TESTED_SHA" -t "$REGISTRY/talk-to-a-document-transcript:$TESTED_SHA" .
            docker push "$REGISTRY/talk-to-a-document-transcript:$TESTED_SHA"
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Initialize application state only
        run: |
          terraform -chdir=infrastructure/terraform/environments/demo init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Plan tested infrastructure
        run: |
          terraform -chdir=infrastructure/terraform/environments/demo plan -input=false -lock-timeout=5m -out=deployment.tfplan
      - name: Apply the saved plan with the scoped OIDC role
        run: terraform -chdir=infrastructure/terraform/environments/demo apply -input=false -lock-timeout=5m deployment.tfplan
      - name: Mandatory deployment smoke tests
        run: |
          PUBLIC_URL="$(terraform -chdir=infrastructure/terraform/environments/demo output -raw public_url)"
          test -n "$PUBLIC_URL" && test "$PUBLIC_URL" != None
          node infrastructure/scripts/smoke.mjs "$PUBLIC_URL"
