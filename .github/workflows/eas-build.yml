name: Expo native binaries
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: expo-native-main
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: mobile-builds
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Require explicit cloud configuration
        run: npx --no-install tsx scripts/eas-verify.ts environment
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 18.3.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Compile and store both native binaries on EAS
        run: eas build --platform all --profile preview --non-interactive --wait --json > eas-builds.json
      - name: Verify completion, tested commit, project and downloadable binaries
        run: npx --no-install tsx scripts/eas-verify.ts eas-builds.json
      - name: Preserve build metadata (binaries remain in Expo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-builds-${{ github.event.workflow_run.head_sha }}
          path: apps/mobile/eas-builds.json
          if-no-files-found: ignore
          retention-days: 30
