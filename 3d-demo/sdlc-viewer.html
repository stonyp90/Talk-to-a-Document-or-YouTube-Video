<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ursly SDLC — Galaxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #292735; color: #f8f5ef; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 16px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #e5e0d822; flex-shrink: 0; }
    header h1 { font-size: 16px; font-weight: 600; color: #F27561; letter-spacing: 0.02em; }
    header span { font-size: 12px; color: #716c78; }
    model-viewer { flex: 1; width: 100%; background: #292735; }
    .caption { padding: 12px 24px; font-size: 11px; color: #716c78; text-align: center; flex-shrink: 0; }

    .overlay {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(41, 39, 53, 0.92);
      border: 1px solid #e5e0d822;
      border-radius: 12px;
      padding: 28px 24px 20px;
      max-width: 260px;
      backdrop-filter: blur(12px);
      z-index: 10;
    }
    .overlay-content { transition: opacity 0.35s ease; }
    .overlay-content.fade { opacity: 0; }
    .stage-number {
      font-size: 11px;
      color: #716c78;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .stage-name {
      font-size: 26px;
      font-weight: 700;
      color: #F27561;
      margin-bottom: 10px;
      line-height: 1.1;
    }
    .stage-desc {
      font-size: 13px;
      color: #f8f5ef;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .progress { display: flex; gap: 5px; }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #716c78;
      transition: background 0.35s ease, transform 0.35s ease;
    }
    .dot.active {
      background: #F27561;
      transform: scale(1.3);
    }

    @media (max-width: 768px) {
      .overlay {
        right: 12px;
        left: 12px;
        top: auto;
        bottom: 56px;
        transform: none;
        max-width: none;
        padding: 20px 18px 16px;
      }
      .stage-name { font-size: 22px; }
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <header>
    <h1>Ursly SDLC</h1>
    <span>Galaxy &middot; 9 planets &middot; 3 animations &middot; 18s orbit</span>
  </header>
  <model-viewer
    src="sdlc-artifact.glb"
    alt="Ursly SDLC galaxy: 9 planets with rings orbiting a central sun"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    auto-rotate-speed="0.3"
    orbit-min-distance="0.15"
    orbit-max-distance="0.6"
    exposure="1.2"
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
  ></model-viewer>

  <div class="overlay">
    <div class="overlay-content" id="overlayContent">
      <div class="stage-number" id="stageNumber">Stage 01</div>
      <div class="stage-name" id="stageName">Plan</div>
      <div class="stage-desc" id="stageDesc">Define scope, goals, and roadmap. Align stakeholders on what to build and why.</div>
      <div class="progress" id="progressDots"></div>
    </div>
  </div>

  <p class="caption">Plan &rarr; Design &rarr; Build &rarr; Integrate &rarr; Validate &rarr; Release &rarr; Operate &rarr; Measure &rarr; Listen</p>

  <script>
    const stages = [
      { name: 'Plan', desc: 'Define scope, goals, and roadmap. Align stakeholders on what to build and why.' },
      { name: 'Design', desc: 'Architect the system, design interfaces, and model data flows.' },
      { name: 'Build', desc: 'Write code, implement features, and craft the user experience.' },
      { name: 'Integrate', desc: 'Connect components, merge branches, and resolve dependencies.' },
      { name: 'Validate', desc: 'Test thoroughly: unit, integration, performance, and security.' },
      { name: 'Release', desc: 'Deploy to production with confidence. Ship value to users.' },
      { name: 'Operate', desc: 'Monitor, maintain, and keep the system running smoothly.' },
      { name: 'Measure', desc: 'Track metrics, gather data, and evaluate outcomes.' },
      { name: 'Listen', desc: 'Collect feedback, understand users, and inform the next cycle.' },
    ];

    const dotsContainer = document.getElementById('progressDots');
    stages.forEach((_, i) => {
      const dot = document.createElement('span');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dotsContainer.appendChild(dot);
    });

    const stageNumber = document.getElementById('stageNumber');
    const stageName = document.getElementById('stageName');
    const stageDesc = document.getElementById('stageDesc');
    const overlayContent = document.getElementById('overlayContent');
    const dots = document.querySelectorAll('.dot');
    let currentStage = 0;

    function showStage(index) {
      const stage = stages[index];
      overlayContent.classList.add('fade');
      setTimeout(() => {
        stageNumber.textContent = 'Stage ' + String(index + 1).padStart(2, '0');
        stageName.textContent = stage.name;
        stageDesc.textContent = stage.desc;
        dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
        overlayContent.classList.remove('fade');
      }, 350);
    }

    setInterval(() => {
      currentStage = (currentStage + 1) % 9;
      showStage(currentStage);
    }, 2000);
  </script>
</body>
</html>
