<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ursly — 3D Brand Scene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #292735; color: #f8f5ef; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #e5e0d822; }
    header h1 { font-size: 16px; font-weight: 600; color: #F27561; letter-spacing: 0.02em; }
    header span { font-size: 12px; color: #716c78; }
    model-viewer { flex: 1; width: 100%; background: #292735; }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <header>
    <h1>Ursly</h1>
    <span>Source &rarr; Understanding &middot; 5 animations &middot; 4s loop</span>
  </header>
  <model-viewer
    src="artifact.glb"
    auto-rotate
    auto-rotate-delay="0"
    auto-rotate-speed="0.8"
    camera-controls
    touch-action="pan-y"
    interpolation-decay="0"
    shadow-intensity="1"
    environment-image="neutral"
    exposure="1.3"
    animation-name="DocumentRead"
    autoplay
  ></model-viewer>
</body>
</html>
