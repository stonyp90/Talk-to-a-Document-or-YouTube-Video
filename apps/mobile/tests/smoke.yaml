appId: com.talktosource.demo
---
- launchApp:
    clearState: true
- assertVisible: "Import a PDF"
- assertVisible: "Voice to action"
- assertVisible: "Keyboard to action"
- assertVisible: "Motion to action"
- tapOn: "Motion to action"
- assertVisible: "Motion to action is not available yet. We are working on it. Voice and keyboard are ready today."
- tapOn: "Keyboard to action"
- assertVisible: "Keyboard to action: everything works by typing and clicking."
- tapOn: "Voice to action"
- tapOn: "About Ursly and language"
- assertVisible: "App language"
- tapOn: "Français"
- assertVisible: "Langue de l’application"
- tapOn: "Fermer"
- assertVisible: "Importer un PDF"
- tapOn: "À propos d’Ursly"
- tapOn: "English"
- tapOn: "Close"
- tapOn: "Try a sample text"
- assertVisible: "The power of small breaks"
- tapOn: "The source"
- assertVisible: "It all starts here."
- tapOn: "Conversation"
- tapOn: "Your question"
- inputText: "What is this source about?"
- hideKeyboard
- tapOn: "Send question"
- extendedWaitUntil:
    visible: "YOU"
    timeout: 45000
- scrollUntilVisible:
    element: "Start voice conversation"
    direction: UP
- tapOn: "Start voice conversation"
- extendedWaitUntil:
    visible: "Session active"
    timeout: 45000
- tapOn: "Mute microphone"
- assertVisible: "Microphone muted"
- tapOn: "Stop session"
- assertVisible: "At your own pace"
