name: talk-to-a-document

x-app-environment: &app-environment
  PROVIDER_MODE: ${PROVIDER_MODE:-mock}
  YOUTUBE_TRANSCRIPT_MODE: live
  TRANSCRIPT_SERVICE_URL: http://transcript:3010
  OBJECT_STORE_ENDPOINT: http://object-store:9000
  OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9002}
  UPLOAD_BUCKET: talk-to-a-document-uploads
  AWS_ACCESS_KEY_ID: local-minio
  AWS_SECRET_ACCESS_KEY: local-minio-password
  OBJECT_STORE_ACCESS_KEY: local-minio
  OBJECT_STORE_SECRET_KEY: local-minio-password
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
  OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
  OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  CONTEXT_CHARACTER_BUDGET: ${CONTEXT_CHARACTER_BUDGET:-120000}
  SESSION_TTL_MS: ${SESSION_TTL_MS:-3600000}
  # The local stack exists to be exercised: the acceptance suite issues far
  # more than the production budget of 20 ingests a minute from one address.
  # Production keeps the limiter; set RATE_LIMIT_DISABLED= to test it here.
  RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-true}

services:
  # Next.js owns both the frontend and API routes; there is no unused second API.
  web:
    build:
      context: .
      target: runtime
      args:
        # The Content Security Policy is fixed at build time, so the browser
        # may only reach the object store the image was built for. It must be
        # the same address the runtime hands out for presigned uploads.
        OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9002}
    environment:
      <<: *app-environment
      PORT: 3000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      object-store-init: { condition: service_completed_successfully }
      transcript: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24

  dev:
    profiles: [dev]
    build: { context: ., target: development }
    environment:
      <<: *app-environment
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-next:/app/apps/web/.next
    depends_on:
      object-store-init: { condition: service_completed_successfully }
      transcript: { condition: service_healthy }

  test:
    profiles: [test]
    build:
      context: .
      target: test
      args:
        # The Content Security Policy is fixed at build time, so the browser
        # may only reach the object store the image was built for. It must be
        # the same address the runtime hands out for presigned uploads.
        OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9002}
    network_mode: service:web
    environment:
      <<: *app-environment
      NODE_ENV: test
      BDD_OBJECT_STORE_URL: http://object-store:9000/minio/health/live
      BDD_S3_ENDPOINT: http://object-store:9000
      BDD_TRANSCRIPT_HEALTH_URL: http://transcript:3010/health
    depends_on:
      web: { condition: service_healthy }
      object-store-init: { condition: service_completed_successfully }
      transcript: { condition: service_healthy }

  object-store:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-password
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:-http://localhost:3000},http://127.0.0.1:${WEB_PORT:-3000}
    ports:
      [
        "127.0.0.1:${OBJECT_STORE_PORT:-9002}:9000",
        "127.0.0.1:${OBJECT_STORE_CONSOLE_PORT:-9003}:9001",
      ]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  object-store-init:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://object-store:9000 local-minio local-minio-password
        mc mb --ignore-existing local/talk-to-a-document-uploads
    depends_on:
      object-store: { condition: service_healthy }

  transcript:
    build: { context: services/transcript }
    environment:
      PORT: 3010
      TRANSCRIPT_MODE: ${TRANSCRIPT_MODE:-mock}
      UPSTREAM_TIMEOUT_SECONDS: 10
      # Set only when YouTube blocks this network; see the README.
      TRANSCRIPT_PROXY_URL: ${TRANSCRIPT_PROXY_URL:-}
    ports: ["127.0.0.1:${TRANSCRIPT_PORT:-3010}:3010"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  minio-data:
  dev-node-modules:
  dev-next:
