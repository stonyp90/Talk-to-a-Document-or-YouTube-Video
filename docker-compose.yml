name: talk-to-a-document

# MinIO no longer publishes to Docker Hub, where the pull is now denied; quay
# is where the same releases live. Written once and referenced by both the
# server and the bucket-creating init container, so the two can never drift.
x-object-store-image: &object-store-image
  ${OBJECT_STORE_IMAGE:-quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z}

x-app-environment: &app-environment
  PROVIDER_MODE: ${PROVIDER_MODE:-mock}
  YOUTUBE_TRANSCRIPT_MODE: live
  # The local stack finds videos from spoken words without a YouTube key: the
  # fixtures are deterministic, so the acceptance and browser suites can speak
  # an artist and open a captioned result with no quota and no network.
  YOUTUBE_SEARCH_MODE: ${YOUTUBE_SEARCH_MODE:-mock}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  YOUTUBE_API_BASE_URL: ${YOUTUBE_API_BASE_URL:-https://www.googleapis.com}
  YOUTUBE_SEARCH_TIMEOUT_MS: ${YOUTUBE_SEARCH_TIMEOUT_MS:-10000}
  VIDEO_SEARCH_MAX_RESULTS: ${VIDEO_SEARCH_MAX_RESULTS:-5}
  VIDEO_SEARCH_RATE_LIMIT: ${VIDEO_SEARCH_RATE_LIMIT:-20}
  VIDEO_SEARCH_RATE_WINDOW_MS: ${VIDEO_SEARCH_RATE_WINDOW_MS:-60000}
  TRANSCRIPT_SERVICE_URL: http://transcript:3010
  OBJECT_STORE_ENDPOINT: http://object-store:9000
  OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9002}
  UPLOAD_BUCKET: talk-to-a-document-uploads
  AWS_ACCESS_KEY_ID: local-minio
  AWS_SECRET_ACCESS_KEY: local-minio-password
  OBJECT_STORE_ACCESS_KEY: local-minio
  OBJECT_STORE_SECRET_KEY: local-minio-password
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
  OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
  OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
  # How the spoken answer sounds. A custom voice id here makes the assistant
  # answer in an enrolled person's voice; see `npm run voice:enroll`.
  OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
  OPENAI_REALTIME_VOICE_SPEED: ${OPENAI_REALTIME_VOICE_SPEED:-1}
  OPENAI_REALTIME_TURN_DETECTION: ${OPENAI_REALTIME_TURN_DETECTION:-semantic_vad}
  OPENAI_REALTIME_TURN_EAGERNESS: ${OPENAI_REALTIME_TURN_EAGERNESS:-auto}
  OPENAI_REALTIME_NOISE_REDUCTION: ${OPENAI_REALTIME_NOISE_REDUCTION:-near_field}
  OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  CONTEXT_CHARACTER_BUDGET: ${CONTEXT_CHARACTER_BUDGET:-120000}
  SESSION_TTL_MS: ${SESSION_TTL_MS:-3600000}
  # The local stack exists to be exercised: the acceptance suite issues far
  # more than the production budget of 20 ingests a minute from one address.
  # Production keeps the limiter; set RATE_LIMIT_DISABLED= to test it here.
  RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-true}
  # The local stack runs open. Its acceptance suite drives every paid endpoint
  # anonymously, on purpose, and there is no mailbox here to read a code from;
  # a gated local stack would test the gate instead of the application. The
  # production default is the opposite — an unset AUTH_MODE means "required" —
  # so this line is the only thing opening it, and only here. Set
  # AUTH_MODE=required to exercise the real gate locally, with EMAIL_MODE=log
  # and the code read from `docker compose logs web`.
  AUTH_MODE: ${AUTH_MODE:-disabled}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-ursly_session}
  AUTH_SESSION_TTL_MS: ${AUTH_SESSION_TTL_MS:-1209600000}
  AUTH_HASH_PEPPER: ${AUTH_HASH_PEPPER:-local-development-pepper}
  AUTH_LOCAL_ACCOUNT_EMAIL: ${AUTH_LOCAL_ACCOUNT_EMAIL:-local@localhost}
  SIGN_IN_CODE_LENGTH: ${SIGN_IN_CODE_LENGTH:-6}
  SIGN_IN_CODE_TTL_MS: ${SIGN_IN_CODE_TTL_MS:-600000}
  SIGN_IN_MAX_CODE_ATTEMPTS: ${SIGN_IN_MAX_CODE_ATTEMPTS:-5}
  USAGE_LIMIT_UNITS: ${USAGE_LIMIT_UNITS:-300}
  USAGE_WINDOW_MS: ${USAGE_WINDOW_MS:-86400000}
  USAGE_UNITS_INGEST: ${USAGE_UNITS_INGEST:-10}
  USAGE_UNITS_UPLOAD: ${USAGE_UNITS_UPLOAD:-1}
  USAGE_UNITS_EXTRACT: ${USAGE_UNITS_EXTRACT:-10}
  USAGE_UNITS_TEXT_CHAT: ${USAGE_UNITS_TEXT_CHAT:-5}
  USAGE_UNITS_REALTIME: ${USAGE_UNITS_REALTIME:-50}
  USAGE_UNITS_TURNS: ${USAGE_UNITS_TURNS:-1}
  USAGE_UNITS_VIDEO_SEARCH: ${USAGE_UNITS_VIDEO_SEARCH:-2}
  AUTH_REQUEST_CODE_RATE_LIMIT: ${AUTH_REQUEST_CODE_RATE_LIMIT:-5}
  AUTH_REQUEST_CODE_RATE_WINDOW_MS: ${AUTH_REQUEST_CODE_RATE_WINDOW_MS:-900000}
  AUTH_CONFIRM_RATE_LIMIT: ${AUTH_CONFIRM_RATE_LIMIT:-10}
  AUTH_CONFIRM_RATE_WINDOW_MS: ${AUTH_CONFIRM_RATE_WINDOW_MS:-900000}
  AUTH_SESSION_RATE_LIMIT: ${AUTH_SESSION_RATE_LIMIT:-60}
  AUTH_SESSION_RATE_WINDOW_MS: ${AUTH_SESSION_RATE_WINDOW_MS:-60000}
  # No mail from a laptop: the code is written to the web service log.
  EMAIL_MODE: ${EMAIL_MODE:-log}
  SES_REGION: ${SES_REGION:-}
  SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
  SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
  # Empty until billing opens: the pricing card then says so instead of
  # printing a figure nobody can pay.
  NEXT_PUBLIC_PAID_PLAN_PRICE: ${NEXT_PUBLIC_PAID_PLAN_PRICE:-}
  NEXT_PUBLIC_PAID_PLAN_URL: ${NEXT_PUBLIC_PAID_PLAN_URL:-}
  SITE_URL: ${SITE_URL:-http://localhost:3000}
  SITE_SAME_AS: ${SITE_SAME_AS:-}
  INTRO_VIDEO_YOUTUBE_ID_EN: ${INTRO_VIDEO_YOUTUBE_ID_EN:-}
  INTRO_VIDEO_YOUTUBE_ID_FR: ${INTRO_VIDEO_YOUTUBE_ID_FR:-}

services:
  # Next.js owns both the frontend and API routes; there is no unused second API.
  web:
    build:
      context: .
      target: runtime
      args:
        # The Content Security Policy is fixed at build time, so the browser
        # may only reach the object store the image was built for. It must be
        # the same address the runtime hands out for presigned uploads.
        OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9002}
        # The paid figure is inlined into the bundle, so the build needs it too.
        NEXT_PUBLIC_PAID_PLAN_PRICE: ${NEXT_PUBLIC_PAID_PLAN_PRICE:-}
        NEXT_PUBLIC_PAID_PLAN_URL: ${NEXT_PUBLIC_PAID_PLAN_URL:-}
        # What the site tells crawlers about itself is prerendered with it.
        SITE_URL: ${SITE_URL:-http://localhost:3000}
        SITE_SAME_AS: ${SITE_SAME_AS:-}
        INTRO_VIDEO_YOUTUBE_ID_EN: ${INTRO_VIDEO_YOUTUBE_ID_EN:-}
        INTRO_VIDEO_YOUTUBE_ID_FR: ${INTRO_VIDEO_YOUTUBE_ID_FR:-}
    environment:
      <<: *app-environment
      PORT: 3000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      object-store-init: { condition: service_completed_successfully }
      transcript: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24

  dev:
    profiles: [dev]
    build: { context: ., target: development }
    environment:
      <<: *app-environment
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-next:/app/apps/web/.next
    depends_on:
      object-store-init: { condition: service_completed_successfully }
      transcript: { condition: service_healthy }

  test:
    profiles: [test]
    build:
      context: .
      target: test
      args:
        # The Content Security Policy is fixed at build time, so the browser
        # may only reach the object store the image was built for. It must be
        # the same address the runtime hands out for presigned uploads.
        OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9002}
        # What the site tells crawlers about itself is prerendered with it.
        SITE_URL: ${SITE_URL:-http://localhost:3000}
        SITE_SAME_AS: ${SITE_SAME_AS:-}
        INTRO_VIDEO_YOUTUBE_ID_EN: ${INTRO_VIDEO_YOUTUBE_ID_EN:-}
        INTRO_VIDEO_YOUTUBE_ID_FR: ${INTRO_VIDEO_YOUTUBE_ID_FR:-}
    network_mode: service:web
    environment:
      <<: *app-environment
      NODE_ENV: test
      BDD_OBJECT_STORE_URL: http://object-store:9000/minio/health/live
      BDD_S3_ENDPOINT: http://object-store:9000
      BDD_TRANSCRIPT_HEALTH_URL: http://transcript:3010/health
    depends_on:
      web: { condition: service_healthy }
      object-store-init: { condition: service_completed_successfully }
      transcript: { condition: service_healthy }

  object-store:
    image: *object-store-image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-password
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:-http://localhost:3000},http://127.0.0.1:${WEB_PORT:-3000}
    ports:
      [
        "127.0.0.1:${OBJECT_STORE_PORT:-9002}:9000",
        "127.0.0.1:${OBJECT_STORE_CONSOLE_PORT:-9003}:9001",
      ]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  object-store-init:
    image: *object-store-image
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://object-store:9000 local-minio local-minio-password
        mc mb --ignore-existing local/talk-to-a-document-uploads
    depends_on:
      object-store: { condition: service_healthy }

  transcript:
    build: { context: services/transcript }
    environment:
      PORT: 3010
      TRANSCRIPT_MODE: ${TRANSCRIPT_MODE:-mock}
      UPSTREAM_TIMEOUT_SECONDS: 10
      # Set only when YouTube blocks this network; see the README.
      TRANSCRIPT_PROXY_URL: ${TRANSCRIPT_PROXY_URL:-}
    ports: ["127.0.0.1:${TRANSCRIPT_PORT:-3010}:3010"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  minio-data:
  dev-node-modules:
  dev-next:
